# Generates GitHub stats cards (including private repos) and commits them to ./assets
#
# REQUIRED SETUP (one-time):
# 1. Create a classic PAT: https://github.com/settings/tokens/new
#    Scopes: repo, read:user
# 2. Add repo secret GRS_PAT with that token:
#    https://github.com/wablevaibhav/wablevaibhav/settings/secrets/actions
# 3. On your GitHub profile → Settings → Profile → enable
#    "Include private contributions on my profile"
# 4. Run this workflow from the Actions tab (workflow_dispatch)

name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/update-stats.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card (public + private via GRS_PAT)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=wablevaibhav&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github&disable_animations=true
          path: assets/github-stats.svg
          token: ${{ secrets.GRS_PAT }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=wablevaibhav&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&disable_animations=true
          path: assets/top-langs.svg
          token: ${{ secrets.GRS_PAT }}
          fail_on_error: true

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=wablevaibhav&theme=tokyonight&hide_border=true&disable_animations=true
          path: assets/github-streak.svg
          token: ${{ secrets.GRS_PAT }}

      - name: Generate activity graph
        run: |
          curl -fsSL \
            "https://github-readme-activity-graph.vercel.app/graph?username=wablevaibhav&bg_color=1a1b27&color=70a5fd&line=bf91f3&point=ffffff&area=true&hide_border=true" \
            -o assets/activity-graph.svg

      - name: Fix SVG visibility (opacity animations break in GitHub img tags)
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          assets = Path("assets")
          for path in assets.glob("*.svg"):
              text = path.read_text(encoding="utf-8", errors="ignore").lstrip()
              text = re.sub(r"\.stagger\s*\{[^}]*\}", ".stagger { opacity: 1; }", text, flags=re.S)
              text = re.sub(r"animation:\s*[^;]+;", "", text)
              text = re.sub(r"opacity\s*:\s*0(\.0+)?\s*;?", "opacity: 1;", text)
              text = re.sub(r'opacity="0(\.0+)?"', 'opacity="1"', text)
              path.write_text(text, encoding="utf-8")
              print(f"fixed {path}")
          PY

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats cards"
          git push
